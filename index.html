<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7f8"><title>Happy Birthday, Moon 💗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff7f8}body{min-height:100vh;display:grid;place-items:center;padding:16px;font-family:system-ui,sans-serif}
.slide{position:relative;width:min(100%,900px, calc((100vh - 32px) * 1.78));overflow:hidden;display:none}.slide.active{display:block}.slide img{display:block;width:100%;height:auto}.s1 .gift-motion{display:none}
.s1{aspect-ratio:561/317}.s2{aspect-ratio:551/291}.s3{aspect-ratio:551/307}.s4{aspect-ratio:551/306}.s5{aspect-ratio:551/310}.s6{aspect-ratio:557/325}.s7{aspect-ratio:561/314}
.hit{position:absolute;border:0;border-radius:999px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.hit:focus-visible{outline:3px solid #a52b45;outline-offset:3px}
.s1 .open{left:35%;top:81%;width:30%;height:18%}.s2 .no{left:8%;top:40%;width:27%;height:19%}.s2 .yes{left:64%;top:40%;width:27%;height:19%}.s3 .no{left:8%;top:39%;width:27%;height:20%}.s3 .yes{left:64%;top:39%;width:27%;height:20%}.s4 .know{left:30%;top:55%;width:40%;height:15%}.s5 .next{left:37%;top:70%;width:26%;height:15%}.s6 .next{left:12.5%;top:78%;width:16%;height:13%}
.nudge{display:none;position:absolute;left:50%;top:62%;transform:translateX(-50%);max-width:88%;padding:9px 15px;border-radius:20px;background:rgba(255,255,255,.97);color:#9b4356;font-weight:700;text-align:center;box-shadow:0 3px 14px rgba(110,40,60,.14);white-space:nowrap}.nudge.show{display:block}
@media(max-width:520px){body{padding:8px}.slide{width:min(100%, calc((100vh - 16px) * 1.78))}}
.birthday-scene{display:block;width:100%;height:auto}.s1 .lid-assembly{transform-box:fill-box;transform-origin:50% 100%;animation:giftLid 3.6s cubic-bezier(.42,0,.58,1) infinite}.s1 .gift-sparkles{transform-origin:50% 50%;animation:giftGlow 3.6s ease-in-out infinite}@keyframes giftLid{0%,12%,100%{transform:translateY(0) rotate(0deg)}38%,62%{transform:translateY(-34px) rotate(-17deg)}82%{transform:translateY(0) rotate(0deg)}}@keyframes giftGlow{0%,15%,82%,100%{opacity:0;transform:scale(.7)}38%,62%{opacity:1;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.s1 .lid-assembly,.s1 .gift-sparkles{animation:none}}
/* Slide 2: gentle motion accents; original artwork and wording stay untouched */
.s2{isolation:isolate}
.s2::before,.s2::after{content:"";position:absolute;z-index:2;pointer-events:none;opacity:.78;font-family:system-ui,sans-serif}
.s2::before{content:"♡";left:3.5%;top:12%;font-size:clamp(22px,4vw,38px);color:#f28da9;text-shadow:0 2px 8px #fff;animation:s2FloatA 3.8s ease-in-out infinite}
.s2::after{content:"🐾";right:3.5%;bottom:10%;font-size:clamp(20px,3.4vw,32px);filter:drop-shadow(0 2px 5px #fff);animation:s2FloatB 4.4s ease-in-out infinite}
.s2 .yes{transform-origin:center;animation:s2YesPulse 2.5s ease-in-out infinite}
.s2 .yes:focus-visible{outline:3px solid #e56f91;outline-offset:4px}
@keyframes s2FloatA{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-11px) rotate(8deg) scale(1.12)}}
@keyframes s2FloatB{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-12deg)}}
@keyframes s2YesPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(240,120,160,0));}50%{filter:drop-shadow(0 0 8px rgba(240,120,160,.42));}}
@media(prefers-reduced-motion:reduce){.s2::before,.s2::after,.s2 .yes{animation:none}}

/* Page 6: soft animated details, original artwork and wording preserved */
.s6{overflow:hidden}
.s6>img{width:100%;height:100%;object-fit:cover;display:block}
.s6 .s6-sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.s6-sparkles i{position:absolute;color:#ef8198;font-style:normal;text-shadow:0 1px 5px #fff;animation:s6Drift 5s ease-in-out infinite}
.s6-sparkles i:nth-child(1){left:5%;top:16%;font-size:25px;animation-delay:-1s}
.s6-sparkles i:nth-child(2){left:34%;top:8%;font-size:17px;animation-delay:-2.4s}
.s6-sparkles i:nth-child(3){left:72%;top:18%;font-size:23px;animation-delay:-3s}
.s6-sparkles i:nth-child(4){left:82%;top:64%;font-size:19px;animation-delay:-.7s}
.s6-sparkles i:nth-child(5){left:27%;top:82%;font-size:18px;animation-delay:-1.8s}
.s6-sparkles i:nth-child(6){left:57%;top:91%;font-size:15px;animation-delay:-3.6s}
.s6-cat{position:absolute;width:23%;height:auto;right:-1%;bottom:-3%;overflow:visible;pointer-events:none;filter:drop-shadow(0 3px 4px #6b536044);animation:s6CatBob 3.8s ease-in-out infinite}
.s6-tail{transform-origin:176px 100px;animation:s6Tail 2.2s ease-in-out infinite}
.s6-blink{animation:s6Blink 4.6s infinite}
.s6-heart{transform-origin:185px 29px;animation:s6Heart 1.8s ease-in-out infinite}
@keyframes s6Drift{0%,100%{transform:translateY(0) rotate(-8deg);opacity:.55}50%{transform:translateY(-12px) rotate(10deg);opacity:1}}
@keyframes s6CatBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes s6Tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes s6Blink{0%,46%,50%,100%{opacity:0}48%{opacity:1}}
@keyframes s6Heart{0%,100%{transform:scale(.85)}50%{transform:scale(1.18)}}
@media(prefers-reduced-motion:reduce){.s6-sparkles i,.s6-cat,.s6-tail,.s6-blink,.s6-heart{animation:none}}
